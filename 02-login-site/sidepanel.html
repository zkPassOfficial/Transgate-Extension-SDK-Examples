<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px system-ui; padding: 12px; margin: 0; }
    h1 { font-size: 14px; margin: 0 0 10px; color: #1a73e8; }
    button { padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .note { margin: 0 0 8px; font-size: 12px; color: #444; }
    code { background: #f5f5f5; padding: 0 4px; border-radius: 3px; }

    .status-block { background: #f1f3f4; border-radius: 6px; padding: 10px; margin: 12px 0; }
    .status-block .label { font-size: 11px; color: #5f6368; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-block .stage { font-size: 15px; font-weight: 600; margin: 4px 0 8px; }
    .status-block .history { margin: 0; padding-left: 18px; font-size: 12px; color: #5f6368; }
    .status-block .history li { line-height: 1.6; }
    .status-block .history li.current { color: #1a73e8; font-weight: 500; }

    .card { border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-top: 10px; }
    .ok { color: #137333; font-weight: 600; }
    .fail { color: #c5221f; font-weight: 600; }
    .row { display: flex; gap: 6px; margin: 2px 0; }
    .k { color: #5f6368; min-width: 130px; flex: none; }
    .v { word-break: break-all; }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    .hint { background: #fff8e1; padding: 8px; border-radius: 4px; margin-top: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>zkPass — Twitter follow</h1>
  <p class="note"><b>Prerequisite:</b> log in to <code>x.com</code> in this browser first.</p>
  <button id="run">Run verification</button>

  <div class="status-block">
    <div class="label">Current stage</div>
    <div class="stage" id="stage">Idle</div>
    <div class="label">History</div>
    <ol class="history" id="history"></ol>
  </div>

  <div id="card"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
